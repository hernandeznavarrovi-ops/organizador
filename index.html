<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0A0D1A;--card:#16181F;--ink:#F2F4FA;--mute:#9AA1B5;--pink:#3A2236;--pinkd:#F59E0B;--blue:#1F2333;--blued:#7BA7FF;--mint:#1C3A33;--line:#272B3D;--ok:#4ADE80;--bad:#FB7185;--rosy:#F59E0B;--btn:#2F6BFF;--btnt:#fff}

.top{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;text-align:center;margin-bottom:16px}.menu{background:none;border:0;color:var(--ink);font-size:1.6rem;cursor:pointer;padding:6px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}@media(min-width:640px){.grid2{grid-template-columns:repeat(3,1fr)}}
.tl{background:var(--card);border:2px solid;border-radius:24px;padding:16px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:130px}.tl b{font-size:1.05rem}.tl small{color:var(--mute)}
.ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;margin-bottom:6px;flex:none}.ic.big{width:56px;height:56px;margin:0}
*{-webkit-tap-highlight-color:transparent}html{overscroll-behavior:none}button{touch-action:manipulation;user-select:none}button:active{transform:scale(.97)}
@media(min-width:900px){main{max-width:1040px}.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}nav{width:min(100%,700px)}.cal button{aspect-ratio:auto;height:76px}.item:hover,.tl:hover,.wide:hover,.btn:hover,.chip:hover{filter:brightness(1.18)}}
.cont{border:1.5px solid #2F6BFF}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wd{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;cursor:pointer;padding:0}.wd small{font-size:.75rem}.wd small.tdy{color:#F59E0B;font-weight:700}.dc{width:32px;height:32px;border-radius:50%;background:#1F2333;display:grid;place-items:center;color:#fff;font-size:.9rem}.dc.on{background:var(--btn)}.dc.now{box-shadow:inset 0 0 0 2px #F59E0B}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}

<script>
const C={grammar:{A1:"to be|Present simple|Present continuous|Present simple or continuous?|Have got|Was / were|Past simple: regular & irregular|Past simple: negatives & questions|Will / shall|Be going to|Can / can't|Imperative|Would you like…? I'd like…|Verb + to / -ing|A/an, plurals|A/an, the, no article|This, that, these, those|Possessive adjectives & subject pronouns|Object vs subject pronouns|A, some, any|Much, many, a lot of, a few|Whose, possessive 's|There is / there are|There or it|This or it|Adjectives|Adverbs of manner|Comparatives|Superlatives|And, but, or, so, because|Prepositions of time|Prepositions of place|Next to, under, between…|Questions: word order|Adverbs of frequency|Basic word order".split('|'),

A2:"Informal invitation|My last holiday|Someone's job|A postcard|Job application letter|Booking a hotel (email)|Opinion essay|Thank-you email|A biography|My favourite photograph".split('|')}};
const SK={grammar:['📐','Grammar','#6EA0FF'],vocab:['🔤','Vocabulary','#4ADE80'],listening:['🎧','Listening','#22D3EE'],reading:['📖','Reading','#A78BFA'],writing:['✍️','Writing','#F472B6'],speaking:['🎤','Speaking','#FB923C']};
const EX={quiz:['🏆','Test','#FACC15'],note:['📝','Nota','#9AA1B5']};
const RES=[['test-english.com','https://test-english.com','Grammar, vocabulary, listening, reading A1–A2'],['British Council LearnEnglish','https://learnenglish.britishcouncil.org','Real reading: signs, menus, tickets'],['englishpracticetest.net','https://englishpracticetest.net','Extra listening tests with transcript'],['Write & Improve (Cambridge)','https://writeandimprove.com','Free writing feedback']];
const LV=['A1','A2','B1','B2'];
function LVC(A){const r=LV.map(l=>{const a=A.filter(x=>x.l==l);return a.length?[l,Math.round(a.filter(x=>S.done[x.id]).length/a.length*100),a.length]:null}).filter(Boolean);return r.length?`<div class="card"><h2>Por nivel</h2>${r.map(([l,p,n])=>`<div class="row" style="margin:6px 0"><b style="width:34px">${l}</b><div class="bar" style="flex:1"><i style="width:${p}%"></i></div><span class="mute" style="width:90px;text-align:right">${p}% · ${n} temas</span></div>`).join('')}</div>`:''}
const KEY='eng-a1a2-v2';let S={log:{},done:{},custom:[],res:RES.map(r=>({t:r[0],u:r[1],n:r[2]})),t:0};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=x}catch(e){}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sh=a=>[...a].sort(()=>Math.random()-.5),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),TODAY=iso(new Date()),norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim();

const nm=id=>(items().find(x=>x.id==id)||{n:'(tema borrado)'}).n;

$('nav').innerHTML='<div class="navin">'+[['hoy','🏠','Hoy'],['pra','✍️','Práctica'],['tem','📋','Temario'],['cal','📅','Calendario'],['rec','🔗','Recursos']].map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';Q=null;if('${k}'=='pra')pt='';render()"><b>${i}</b>${l}</button>`).join('')+'</div>'}

function vHoy(){const L=S.log[TODAY]||[],h=new Date().getHours(),gr=h<12?'Hola, buen día':h<19?'Hola, buenas tardes':'Hola, buenas noches',n=streak();
const week=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Esta semana</b><span style="color:#F59E0B;font-size:.85rem">🔥 Racha: ${n} día${n==1?'':'s'}</span></div><div class="week">${weekDays().map((k,i)=>{const dn=(S.log[k]||[]).length>0;return `<button class="wd" onclick="sel='${k}';tab='cal';render()" aria-label="${k}"><small class="${k==TODAY?'tdy':''}">${'LMMJVSD'[i]}</small><span class="dc ${dn?'on':''} ${k==TODAY?'now':''}">${dn?'✓':''}</span></button>`}).join('')}</div></div>`;
return `<div class="cols"><div><div style="margin:0 2px 14px"><h2 style="font-size:1.35rem;margin:0">${gr}</h2><div class="mute">${new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</div></div>${week}${contCard()}</div><div>${noteCard()}${hT()}
<div class="card"><h2>Hoy estudié</h2>${L.length?'<ul>'+L.map(ent).join('')+'</ul>':'<p class="mute">Todavía no registraste nada hoy.</p>'}
<div class="row" style="margin-top:8px"><input id="fn" placeholder="Anotar algo que estudiaste" style="flex:1;min-width:180px"><button class="btn" onclick="if($('fn').value.trim())logE({s:'note',n:$('fn').value.trim()})">Agregar</button></div></div></div></div>`}
